name: Rassegna stampa (candidati)

on:
  schedule:
    # mercoledi e sabato alle 4:19 UTC
    - cron: '19 4 * * 3,6'
  workflow_dispatch:
    inputs:
      giorni:
        description: "Quanti giorni indietro guardare (predefinito 45)"
        required: false
        default: ''
      solo:
        description: "Solo una parte: feed oppure sentinella (vuoto = tutto)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: rassegna-dinners
  cancel-in-progress: false

jobs:
  prepara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Leggi feed e pagine delle guide
        run: |
          ARG=""
          if [ -n "${{ github.event.inputs.giorni }}" ]; then ARG="--giorni ${{ github.event.inputs.giorni }}"; fi
          if [ -n "${{ github.event.inputs.solo }}" ]; then ARG="$ARG --solo ${{ github.event.inputs.solo }}"; fi
          python3 scripts/rassegna.py $ARG

      - name: Salva i candidati
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain rassegna)" ]; then
            echo "nessun candidato nuovo"
            exit 0
          fi
          # rassegna/ la scrive solo questo flusso: in caso di scontro con la
          # pubblicazione della guida vince la nostra copia, il resto e' di origin
          riuscito=0
          for i in 1 2 3 4 5; do
            rm -rf /tmp/rassegna && cp -r rassegna /tmp/rassegna
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf rassegna && cp -r /tmp/rassegna rassegna
            git add rassegna
            if git diff --cached --quiet; then
              echo "niente da salvare dopo l'allineamento"
              riuscito=1
              break
            fi
            git commit -q -m "Rassegna stampa: candidati del $(date +%d/%m/%Y)"
            if git push -q origin HEAD:main; then riuscito=1; break; fi
            echo "tentativo $i non riuscito, riprovo"
            sleep $((i * 5))
          done
          if [ "$riuscito" != "1" ]; then
            echo "::error::i candidati non sono stati salvati dopo 5 tentativi"
            exit 1
          fi
